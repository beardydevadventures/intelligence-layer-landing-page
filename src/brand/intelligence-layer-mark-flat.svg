<svg xmlns="http://www.w3.org/2000/svg" viewBox="115 79 370 410" role="img" aria-labelledby="title desc">
  <title id="title">Intelligence Layer mark</title>
  <desc id="desc">Flat vector version of the Intelligence Layer mark.</desc>
